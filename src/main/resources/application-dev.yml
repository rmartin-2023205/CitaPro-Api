spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/citapro}
    username: ${DB_USERNAME:citapro}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.citapro: DEBUG
    org.springframework.security: INFO

